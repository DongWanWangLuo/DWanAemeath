name: Refresh and deploy blog

on:
  # GitHub 使用 UTC；每天 00:17 和 12:17 执行一次（北京时间 08:17 和 20:17）。
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy-blog
  cancel-in-progress: true

env:
  # 所有部署坐标都来自仓库 Secrets，公开仓库不保存真实服务器信息。
  DEPLOY_HOST: ${{ secrets.RAINZT_DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.RAINZT_DEPLOY_USER }}
  DEPLOY_PORT: ${{ secrets.RAINZT_DEPLOY_PORT || '22' }}
  DEPLOY_PATH: ${{ secrets.RAINZT_DEPLOY_PATH }}
  REMOTE_ARCHIVE: /tmp/firefly-dist-latest.tgz

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "Missing repository secret: RAINZT_DEPLOY_HOST"
            exit 1
          fi
          if [ -z "${DEPLOY_USER:-}" ]; then
            echo "Missing repository secret: RAINZT_DEPLOY_USER"
            exit 1
          fi
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Missing repository secret: RAINZT_DEPLOY_PATH"
            exit 1
          fi

      - name: Build site and refresh RSS snapshot
        env:
          FRIENDS_FEED_WRITE_SNAPSHOT: "1"
        run: pnpm build

      - name: Save refreshed RSS snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/friends-feed-snapshot.json; then
            echo "RSS snapshot unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/friends-feed-snapshot.json
          git commit -m "chore: refresh moments feed snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Package static site
        run: tar -czf firefly-dist-latest.tgz -C dist .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.RAINZT_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RAINZT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "Missing repository secret: RAINZT_DEPLOY_KEY"
            exit 1
          fi

          # Secrets are sometimes pasted with Windows CRLF or literal "\\n"
          # sequences. Normalize those harmless formatting differences before
          # handing the key to OpenSSH; the secret must still be an
          # unencrypted OpenSSH private key, not a .pub or .ppk file.
          DEPLOY_KEY="${DEPLOY_KEY//$'\r'/}"
          DEPLOY_KEY="${DEPLOY_KEY//\\n/$'\n'}"
          DEPLOY_KEY="${DEPLOY_KEY#\"}"
          DEPLOY_KEY="${DEPLOY_KEY%\"}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1; then
            echo "Invalid RAINZT_DEPLOY_KEY: use the complete OpenSSH private key (-----BEGIN ... PRIVATE KEY-----), not the .pub or .ppk file."
            exit 1
          fi
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi

      - name: Upload and replace site atomically
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            firefly-dist-latest.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_ARCHIVE"

          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "SITE_PATH='$DEPLOY_PATH' REMOTE_ARCHIVE='$REMOTE_ARCHIVE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          SITE="$SITE_PATH"
          ARCHIVE="$REMOTE_ARCHIVE"
          BACKUP_ROOT="/www/backup"
          STAMP="$(date +%Y%m%d%H%M%S)"
          BACKUP="$BACKUP_ROOT/firefly-action-$STAMP"

          mkdir -p "$BACKUP_ROOT"
          if [ -d "$SITE" ]; then
            mkdir -p "$BACKUP"
            cp -a "$SITE"/. "$BACKUP"/ || true
          else
            mkdir -p "$SITE"
          fi

          find "$SITE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$ARCHIVE" -C "$SITE"
          if id www >/dev/null 2>&1; then chown -R www:www "$SITE"; fi
          find "$SITE" -type d -exec chmod 755 {} \;
          find "$SITE" -type f -exec chmod 644 {} \;

          # server-status.php is a read-only metrics endpoint. Keep its PHP-FPM
          # route outside the static site so every atomic replacement preserves it.
          NGINX_SITE_CONF="/www/server/panel/vhost/nginx/firefly.conf"
          NGINX_STATUS_CONF="/www/server/panel/vhost/nginx/firefly-server-status.inc"
          PHP_SOCKET="$(find /tmp -maxdepth 1 -type s -name 'php-cgi-*.sock' -print -quit)"
          if [ -z "${PHP_SOCKET:-}" ]; then
            echo "No active PHP-FPM socket found; cannot enable server metrics endpoint."
            exit 1
          fi
          if [ ! -f "$NGINX_SITE_CONF" ]; then
            echo "Missing Nginx site config: $NGINX_SITE_CONF"
            exit 1
          fi
          cat > "$NGINX_STATUS_CONF" <<NGINX_STATUS
          location = /api/server-status.php {
              try_files \$uri =404;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
              fastcgi_pass unix:${PHP_SOCKET};
          }
          NGINX_STATUS
          if ! grep -Fq "$NGINX_STATUS_CONF" "$NGINX_SITE_CONF"; then
            cp -a "$NGINX_SITE_CONF" "$NGINX_SITE_CONF.server-status-$STAMP.bak"
            sed -i "/firefly-ai-admin.inc/i\\    include $NGINX_STATUS_CONF;" "$NGINX_SITE_CONF"
          fi

          if [ -x /www/server/nginx/sbin/nginx ]; then
            /www/server/nginx/sbin/nginx -t
            /www/server/nginx/sbin/nginx -s reload
          else
            nginx -t
            nginx -s reload
          fi

          rm -f "$ARCHIVE"
          # 自动任务只保留最近 7 天的备份，避免长期运行占满磁盘。
          find "$BACKUP_ROOT" -maxdepth 1 -type d -name 'firefly-action-*' -mtime +7 -exec rm -rf -- {} +
          REMOTE_SCRIPT

      - name: Verify deployed moments page
        run: curl --fail --silent --show-error --location --max-time 30 "https://rainzt.cn/moments/?run=${GITHUB_RUN_ID}" | grep -q "朋友圈"
