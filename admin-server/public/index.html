<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firedre 后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#333}
.login-box{max-width:380px;margin:100px auto;padding:32px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.login-box h1{text-align:center;margin-bottom:24px;font-size:22px}
.login-box input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:#4f46e5}
.login-box button{width:100%;padding:11px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.login-box button:hover{background:#4338ca}
.error{color:#ef4444;font-size:13px;margin-bottom:12px;text-align:center}
.layout{display:flex;height:100vh}
.sidebar{width:200px;background:#1e1e2e;color:#cdd6f4;padding:20px 0;flex-shrink:0}
.sidebar h2{padding:0 20px 16px;font-size:16px;border-bottom:1px solid #313244;padding-bottom:16px}
.sidebar nav a{display:block;padding:9px 20px;color:#a6adc8;text-decoration:none;font-size:14px}
.sidebar nav a:hover,.sidebar nav a.active{background:#313244;color:#cdd6f4}
.main{flex:1;padding:28px;overflow-y:auto}
.main h2{margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-primary{background:#4f46e5;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f9fafb;font-weight:600}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid #e5e7eb;margin-bottom:20px}
.empty{text-align:center;padding:40px;color:#999}
code{background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API="/admin";
let token="",user="";

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

async function api(method,path,body){
  const opts={method,headers:{"Content-Type":"application/json"}};
  if(token) opts.headers["Cookie"]=token;
  if(body!==undefined) opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  try{const d=await r.json();if(r.status===401){token="";user="";render();return null;}return d;}catch(e){return null;}
}

async function login(u,p){return api("POST","/login",{username:u,password:p});}
async function getSession(){return api("GET","/session");}

async function init(){
  const d=await getSession();
  if(d&&d.authenticated){user=d.username;token=document.cookie.match(/admin_session=([^;]+)/)?.[1]||"";showMain("posts");}
  else renderLogin();
}

function renderLogin(err){
  document.getElementById("app").innerHTML=
  "<div class='login-box'><h1>\ud83d\udd25 Firedre \u540e\u53f0</h1>" +
  (err?'<div class="error">'+err+'</div>':'') +
  "<input id='u' placeholder=\u7528\u6237\u540d value='admin'>" +
  "<input id='p' type=password placeholder=\u5bc6\u7801 value='admin123'>" +
  "<button onclick=doLogin()>\u767b\u5f55</button></div>";
}

async function doLogin(){
  const u=document.getElementById("u").value;
  const p=document.getElementById("p").value;
  const d=await login(u,p);
  if(d&&d.ok){user=d.username;token=document.cookie.match(/admin_session=([^;]+)/)?.[1]||"";showMain("posts");}
  else renderLogin("\u7528\u6237\u540d\u6216\u5bc6\u7801\u9519\u8bef");
}

function showMain(initialPage){
  document.getElementById("app").innerHTML=
  "<div class=layout>" +
  "<div class=sidebar><h2>\ud83d\udd25 Firedre</h2><nav>" +
  "<a href=# onclick=nav(\"posts\");return false>\ud83d\udcdd \u6587\u7ae0</a>" +
  "<a href=# onclick=nav(\"friends\");return false>\ud83d\udd17 \u53cb\u94fe</a>" +
  "<a href=# onclick=nav(\"dynamics\");return false>\ud83d\udcac \u52a8\u6001</a>" +
  "<a href=# onclick=nav(\"notice\");return false>\ud83d\udce2 \u516c\u544a</a>" +
  "<a href=# onclick=nav(\"albums\");return false>\ud83d\udcf7 \u76f8\u518c</a>" +
  "<a href=# onclick=nav(\"settings\");return false>\u2699\ufe0f \u8bbe\u7f6e</a>" +
  "</nav></div>" +
  "<div class=main id=main><div style=padding:20px><button class=btn onclick=logout()>\u9000\u51fa\u767b\u5f55</button> <span>"+esc(user)+"</span></div><div id=content></div></div></div>";
  if(initialPage) navigate(initialPage);
}

async function nav(p){
  navigate(p);
}

async function navigate(p){
  const el=document.getElementById("content");
  if(!el)return;
  switch(p){
    case "posts": await loadPosts(el); break;
    case "friends": await loadItems(el,"/friends","friends","\u53cb\u94fe\u7ba1\u7406"); break;
    case "dynamics": await loadItems(el,"/dynamics","items","\u52a8\u6001\u7ba1\u7406"); break;
    case "notice": await loadNotice(el); break;
    case "albums": await loadItems(el,"/albums","albums","\u76f8\u518c\u7ba1\u7406"); break;
    case "settings": await loadSettings(el); break;
  }
}

async function loadPosts(el){
  const d=await api("GET","/posts");
  const posts=d?.posts||[];
  if(!posts.length){el.innerHTML="<div class=card><div class=empty>\u6682\u65e0\u6587\u7ae0<br><br><button class=btn btn-primary onclick=createPost()>\u521b\u5efa\u7b2c\u4e00\u7bc7\u6587\u7ae0</button></div></div>";return;}
  el.innerHTML="<div class=card><div class=topbar><h2>\u6587\u7ae0\u7ba1\u7406</h2><button class=btn btn-primary onclick=createPost()>+ \u65b0\u5efa\u6587\u7ae0</button></div>" +
  "<table><tr><th>\u6807\u9898</th><th>Slug</th><th>\u65e5\u671f</th><th>\u64cd\u4f5c</th></tr>" +
  posts.map(p=>"<tr><td>"+esc(p.title)+"</td><td><code>"+esc(p.slug)+"</code></td><td>"+esc(p.date)+"</td>"+
  "<td><button class=btn btn-danger onclick=delPost(\""+esc(p.slug)+"\")>\u5220\u9664</button></td></tr>").join("") +
  "</table></div>";
}

async function createPost(){
  const title=prompt("\u6587\u7ae0\u6807\u9898\uff1a","\u65b0\u6587\u7ae0");
  if(!title)return;
  const slug=prompt("\u6587\u7ae0\u94fe\u63a5\uff08slug\uff09\uff1a",title.replace(/\s+/g,"-").toLowerCase());
  if(!slug)return;
  const body=prompt("\u6587\u7ae0\u5185\u5bb9\uff08\u652f\u6301 Markdown\uff09\uff1a","\u8fd9\u662f\u6587\u7ae0\u5185\u5bb9");
  const source="---\ntitle: "+title+"\nslug: "+slug+"\ndate: "+new Date().toISOString().slice(0,10)+"\npublished: true\n---\n"+(body||"");
  const d=await api("POST","/posts",{source});
  if(d&&d.ok)loadPosts(document.getElementById("content"));
}

async function delPost(slug){
  if(!confirm("\u786e\u5b9a\u5220\u9664\u8be5\u6587\u7ae0\uff1f"))return;
  await api("DELETE","/posts/"+encodeURIComponent(slug));
  loadPosts(document.getElementById("content"));
}

async function loadItems(el,path,key,title){
  const d=await api("GET",path);
  const items=d?.[key]||[];
  el.innerHTML="<h2>"+title+"</h2><div class=card><pre>"+JSON.stringify(items,null,2)+"</pre></div>";
}

async function loadNotice(el){
  const d=await api("GET","/notice");
  el.innerHTML="<h2>\u516c\u544a\u680f</h2><div class=card><pre>"+JSON.stringify(d,null,2)+"</pre></div>";
}

async function loadSettings(el){
  const d=await api("GET","/settings");
  el.innerHTML="<h2>\u7cfb\u7edf\u8bbe\u7f6e</h2><div class=card><pre>"+JSON.stringify(d,null,2)+"</pre></div>";
}

async function logout(){
  await api("POST","/logout");
  token="";user="";renderLogin();
}

init();
</script>
</body>
</html>
