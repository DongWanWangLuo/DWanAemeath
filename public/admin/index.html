<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 - DWan博客</title>
  <link rel="icon" href="/favicon/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" href="/favicon/favicon-16x16.png" sizes="16x16" />
  <link rel="stylesheet" href="https://unpkg.com/embla-carousel@8.0.0-rc.11/dist/embla-carousel.css">
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #cms { min-height: 100vh; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 18px; color: #666; }
    .loading::before { content: ''; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cms">
    <div class="loading">正在加载后台管理系统...</div>
  </div>
  <script type="module">
    import CMS from 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
    CMS.init({ config: { locale: 'zh-CN' } });
    window.addEventListener('load', () => {
      const loadingEl = document.querySelector('.loading');
      if (loadingEl) loadingEl.remove();
    });
  </script>
</body>
</html>
