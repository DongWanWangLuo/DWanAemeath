<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWan博客管理后台</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #666; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载管理后台...</div>
  <script id="decap-cms-config" type="application/json">
{
  "backend": {
    "name": "github",
    "repo": "DongWanWangLuo/DWanAemeath",
    "branch": "main",
    "auth_type": "pkce",
    "app_id": "Iv23LiHuTbSQ7vUgQ5Xm"
  },
  "media_folder": "public/assets/uploads",
  "public_folder": "/assets/uploads",
  "collections": [
    {
      "name": "posts",
      "label": "文章",
      "folder": "src/content/posts",
      "create": true,
      "slug": "{{slug}}",
      "identifier_field": "title",
      "fields": [
        { "label": "标题", "name": "title", "widget": "string" },
        { "label": "发布日期", "name": "published", "widget": "datetime" },
        { "label": "最后更新时间", "name": "updated", "widget": "datetime", "required": false },
        { "label": "描述", "name": "description", "widget": "text" },
        { "label": "AI 摘要", "name": "aiSummary", "widget": "text", "required": false },
        { "label": "封面图", "name": "image", "widget": "image", "required": false },
        { "label": "标签", "name": "tags", "widget": "list", "required": false },
        { "label": "分类", "name": "category", "widget": "string", "required": false },
        { "label": "草稿状态", "name": "draft", "widget": "boolean", "default": false },
        { "label": "置顶", "name": "pinned", "widget": "boolean", "default": false },
        { "label": "正文", "name": "body", "widget": "markdown" }
      ]
    },
    {
      "name": "siteConfig",
      "label": "站点基础配置",
      "file": "src/config/siteConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "站点标题", "name": "title", "widget": "string" },
        { "label": "站点副标题", "name": "subtitle", "widget": "string" },
        { "label": "站点 URL", "name": "site_url", "widget": "string" },
        { "label": "站点描述", "name": "description", "widget": "text" },
        { "label": "主题色色相 (0-360)", "name": "themeColor.hue", "widget": "number" },
        { "label": "页面宽度 (rem)", "name": "pageWidth", "widget": "number" },
        { "label": "关键词列表", "name": "keywords", "widget": "list" }
      ]
    },
    {
      "name": "backgroundWallpaper",
      "label": "壁纸配置",
      "file": "src/config/backgroundWallpaper.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "壁纸模式", "name": "mode", "widget": "select", "options": ["banner", "fullscreen", "overlay", "none"] },
        { "label": "首页横幅标题", "name": "homeText.title", "widget": "string" },
        { "label": "横幅副标题列表", "name": "homeText.subtitle", "widget": "list" },
        { "label": "打字机效果", "name": "homeText.typewriter.enable", "widget": "boolean" },
        { "label": "背景音乐开关", "name": "playerEnable", "widget": "boolean" }
      ]
    },
    {
      "name": "profileConfig",
      "label": "个人资料",
      "file": "src/config/profileConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "姓名", "name": "name", "widget": "string" },
        { "label": "英文名", "name": "englishName", "widget": "string" },
        { "label": "头像", "name": "avatar", "widget": "image" },
        { "label": "简介", "name": "bio", "widget": "text" },
        { "label": "GitHub 链接", "name": "links.github", "widget": "string" },
        { "label": "Bilibili 链接", "name": "links.bilibili", "widget": "string" },
        { "label": "邮箱", "name": "links.email", "widget": "string" }
      ]
    },
    {
      "name": "navBarConfig",
      "label": "导航栏配置",
      "file": "src/config/navBarConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "导航栏标题", "name": "title", "widget": "string" },
        { "label": "Logo 类型", "name": "logo.type", "widget": "select", "options": ["image", "icon", "url"] },
        { "label": "Logo 值", "name": "logo.value", "widget": "string" }
      ]
    },
    {
      "name": "friendsConfig",
      "label": "友情链接",
      "file": "src/config/friendsConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "友链列表", "name": "links", "widget": "list", "fields": [
          { "label": "标题", "name": "title", "widget": "string" },
          { "label": "描述", "name": "desc", "widget": "string" },
          { "label": "头像", "name": "imgurl", "widget": "image" },
          { "label": "链接", "name": "siteurl", "widget": "string" },
          { "label": "标签", "name": "tags", "widget": "list" }
        ]}
      ]
    },
    {
      "name": "musicConfig",
      "label": "音乐播放器",
      "file": "src/config/musicConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "播放器开关", "name": "enable", "widget": "boolean" },
        { "label": "歌曲列表", "name": "playlist", "widget": "list", "fields": [
          { "label": "歌曲名", "name": "title", "widget": "string" },
          { "label": "歌手", "name": "artist", "widget": "string" },
          { "label": "歌词文件", "name": "lrc", "widget": "string" },
          { "label": "音频文件", "name": "url", "widget": "string" }
        ]}
      ]
    },
    {
      "name": "announcementConfig",
      "label": "首页公告",
      "file": "src/config/announcementConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "公告开关", "name": "enable", "widget": "boolean" },
        { "label": "公告内容", "name": "content", "widget": "text" },
        { "label": "背景图", "name": "bgImage", "widget": "image" }
      ]
    },
    {
      "name": "sidebarConfig",
      "label": "侧边栏配置",
      "file": "src/config/sidebarConfig.ts",
      "editor": { "preview": false },
      "fields": [
        { "label": "侧边栏开关", "name": "enable", "widget": "boolean" },
        { "label": "内容", "name": "items", "widget": "list" }
      ]
    }
  ]
}
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var configEl = document.getElementById('decap-cms-config');
    CMS.init({ config: JSON.parse(configEl.textContent) });
    document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
